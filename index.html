<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>世界时间 & 天气看板</title>
    
    <link rel="icon" href="assets/worldtime.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/worldtime.png">
    <meta name="theme-color" content="#f5f7fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="worldtime.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js" defer></script>
</head>
<body>
    <nav class="float-btn-group">
        <a href="https://www.doubao.com/chat/?channel=browser_landing_page" target="_blank" rel="noopener noreferrer" class="float-btn">
            <span class="doubao-icon">(✿◡‿◡) 豆包</span>
        </a>
        <a href="https://translate.google.com/?hl=zh-cn&sl=auto&tl=en&op=translate" target="_blank" rel="noopener noreferrer" class="float-btn">
            <span class="doubao-icon">翻译谷歌</span>
        </a>
        <a href="https://www.speedtest.net/ja" target="_blank" rel="noopener noreferrer" class="float-btn">
            <span class="doubao-icon">Speedtest测速</span>
        </a>
        <a href="https://www.deyingluxury.com/products" target="_blank" rel="noopener noreferrer" class="float-btn">
            <span class="doubao-icon">Deyingluxury网站</span>
        </a>
        <button class="float-btn" id="themeBtn">
            🎨 换肤
        </button>
    </nav>

    <main class="container">
        <h1>世界时间 & 天气看板</h1>
        <div class="tip">长按拖拽排序 · 点击卡片切换标记状态 · 天气每30分钟自动刷新</div>
        
        <section class="time-machine">
            <span class="tm-label">📅 预约推算:</span>
            <input type="datetime-local" id="simTimeInput">
            <button id="resetTimeBtn" class="active">回到现在</button>
        </section>
        
        <section class="main-clock-wrapper">
            <div class="main-card" id="mainCard">
                <span class="label">🇨🇳 北京 (基准时间)</span>
                <div class="time" id="bj-time">00:00:00</div>
                <div class="date" id="bj-date">...</div>
            </div>
        </section>
        
        <section class="grid-container" id="clocks-grid">
            </section>
    </main>

    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-title">添加新城市</div>
            <div class="search-box">
                <input class="search-input" id="citySearch" placeholder="搜索: 城市名 / 拼音 / 国家 / 区号 (如: 86, US, Tokyo)">
            </div>
            <div class="city-list" id="cityListContainer"></div>
            <div class="btn-group">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-confirm" id="confirmBtn" disabled>确认添加</button>
            </div>
        </div>
    </div>

    <video id="sakura-video" muted playsinline preload="metadata">
        <source src="assets/sakura.mp4" type="video/mp4">
    </video>

    <script src="cities.js"></script>
    <script src="worldtime.js"></script>
</body>
</html>
